[project]
name = "lz-mlx"
version = "0.1.0"
description = "Leela Zero training on Apple Silicon with MLX (spec 06)"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.25",
    "numpy>=2",
]

[project.scripts]
lz-train = "lz.train:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
